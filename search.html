<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Results — RoznamaAds.pk</title>
<meta name="description" content="Search Pakistani newspaper classified ads on RoznamaAds.pk">
<link rel="canonical" href="https://roznamaads.pk/search.html">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="hero" style="padding:24px 18px">
  <div class="site-header-bar">
    <a href="index.html" class="brand-row"><img src="logo.svg" alt="RoznamaAds.pk logo" class="logo-img">RoznamaAds<span style="opacity:.7">.pk</span></a>
  </div>
  <h1 class="visually-hidden">Search Classified Ads — RoznamaAds.pk</h1>
  <div class="search-wrap" style="margin-top:6px">
    <label for="searchInput" class="visually-hidden">Search ads</label>
    <input id="searchInput" placeholder="e.g. Lahore property, government job, used car...">
  </div>
</header>

<main id="main-content">
  <div class="filter-bar">
    <select id="fCat" aria-label="Filter by category">
      <option value="">All Categories</option>
    </select>
    <select id="fCity" aria-label="Filter by city">
      <option value="">All Cities</option>
      <option>Lahore</option><option>Karachi</option><option>Islamabad</option>
      <option>Rawalpindi</option><option>Faisalabad</option><option>Multan</option>
      <option>Peshawar</option><option>Quetta</option>
    </select>
    <button id="applySearch">Search</button>
  </div>

  <p class="result-count" id="resultSummary">Search karne ke liye upar text likhein.</p>

  <div class="ad-grid" id="resultsGrid"></div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-brand"><img src="logo.svg" alt="RoznamaAds.pk logo" class="foot-logo-img">RoznamaAds.pk</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="submit-ad.html">Submit Ad</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
    <p class="copy">© 2026 RoznamaAds.pk — Pakistani Newspaper Classifieds, Digital.<br><a href="mailto:roznamaads@gmail.com" class="foot-email">roznamaads@gmail.com</a></p>
  </div>
</footer>

<script>
fetch('categories.json').then(r => r.json()).then(cats => {
  const sel = document.getElementById('fCat');
  cats.filter(c => c.active).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.label;
    sel.appendChild(opt);
  });
}).catch(() => {});

const params = new URLSearchParams(location.search);
const q = params.get('q') || '';
if(q){
  document.getElementById('searchInput').value = q;
  document.getElementById('resultSummary').textContent = `"${q}" ke liye results — abhi placeholder mode mein.`;
}

function runSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const cat = document.getElementById('fCat').value;
  const city = document.getElementById('fCity').value;

  if(!q && !cat && !city){
    document.getElementById('resultSummary').textContent = 'Search karne ke liye upar text likhein.';
    document.getElementById('resultsGrid').innerHTML = '';
    return;
  }
  performSearch(q, cat, city);
}

async function performSearch(q, cat, city){
  const grid = document.getElementById('resultsGrid');
  const summary = document.getElementById('resultSummary');
  summary.textContent = 'Searching...';
  grid.innerHTML = '';
  try{
    let query = rzDb.from('ads').select('id, category, title, city, price, created_at').eq('status', 'live');
    if(q) query = query.or(`title.ilike.%${q}%,description.ilike.%${q}%`);
    if(cat) query = query.eq('category', cat);
    if(city) query = query.eq('city', city);
    query = query.order('created_at', {ascending:false}).limit(30);
    const { data, error } = await query;
    if(error) throw error;
    if(!data || data.length === 0){
      summary.textContent = 'Koi result nahi mila.';
      grid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><div class="icon">🔍</div>Koi matching ad nahi mili — koi doosra keyword try karein.</div>`;
      return;
    }
    summary.textContent = `${data.length} result(s) mile.`;
    grid.innerHTML = data.map(ad => `
      <a class="ad-card" href="ad.html?id=${ad.id}" style="text-decoration:none;color:inherit">
        <h4>${ad.title}</h4>
        <span class="meta">${ad.city}${ad.price ? ' · ' + ad.price : ''}</span>
      </a>
    `).join('');
  }catch(e){
    summary.textContent = 'Search mein masla hua.';
  }
}

document.getElementById('applySearch').addEventListener('click', runSearch);
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') runSearch();
});
if(q) runSearch();
</script>
</body>
</html>
