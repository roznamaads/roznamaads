<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">Category — RoznamaAds.pk</title>
<meta id="pageDesc" name="description" content="Browse classified ads by category on RoznamaAds.pk">
<link id="canonicalLink" rel="canonical" href="https://roznamaads.pk/category.html">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="hero" style="padding:20px 18px">
  <div class="site-header-bar">
    <a href="index.html" class="brand-row"><img src="logo.svg" alt="RoznamaAds.pk logo" class="logo-img">RoznamaAds<span style="opacity:.7">.pk</span></a>
  </div>
</header>

<nav class="cat-nav" id="catNav" aria-label="Category navigation"></nav>

<div class="subheader">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">Home</a> / <span id="breadcrumbCat">Category</span></div>
    <h1 id="catTitle">Category</h1>
  </div>
</div>

<main id="main-content" style="margin-top:0">
  <div class="filter-bar">
    <select id="fCity" aria-label="Filter by city">
      <option value="">All Cities</option>
      <option>Lahore</option>
      <option>Karachi</option>
      <option>Islamabad</option>
      <option>Rawalpindi</option>
      <option>Faisalabad</option>
      <option>Multan</option>
      <option>Peshawar</option>
      <option>Quetta</option>
    </select>
    <select id="fPrice" aria-label="Filter by price range">
      <option value="">Any Price</option>
      <option>Under 5 Lac</option>
      <option>5–20 Lac</option>
      <option>20–50 Lac</option>
      <option>50 Lac+</option>
    </select>
    <select id="fDate" aria-label="Sort by date">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
    </select>
    <button id="applyFilters">Apply</button>
  </div>

  <p class="result-count" id="resultCount">Loading...</p>

  <div class="ad-grid" id="catAdsGrid"></div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-brand"><img src="logo.svg" alt="RoznamaAds.pk logo" class="foot-logo-img">RoznamaAds.pk</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="submit-ad.html">Submit Ad</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
    <p class="copy">© 2026 RoznamaAds.pk — Pakistani Newspaper Classifieds, Digital.<br><a href="mailto:roznamaads@gmail.com" class="foot-email">roznamaads@gmail.com</a></p>
  </div>
</footer>

<script>
let CATEGORIES = {};
let catNavList = [];

fetch('categories.json').then(r => r.json()).then(cats => {
  catNavList = cats.filter(c => c.active);
  catNavList.forEach(c => CATEGORIES[c.id] = {label: c.label});
  initPage();
}).catch(() => { initPage(); });

function initPage(){
  const params = new URLSearchParams(location.search);
  const catKey = (params.get('cat') || '').toLowerCase();
  const cat = CATEGORIES[catKey] || { label: "All Categories" };

  document.getElementById('catTitle').textContent = cat.label;
  document.getElementById('breadcrumbCat').textContent = cat.label;
  document.getElementById('pageTitle').textContent = cat.label + " Ads — RoznamaAds.pk";
  document.getElementById('pageDesc').setAttribute('content', cat.label + " classified ads from Pakistani newspapers — searchable on RoznamaAds.pk");
  if(CATEGORIES[catKey]){
    document.getElementById('canonicalLink').setAttribute('href', 'https://roznamaads.pk/category.html?cat=' + catKey);
  }

  const catNav = document.getElementById('catNav');
  catNav.innerHTML = catNavList.map(c =>
    `<a href="category.html?cat=${c.id}" class="${c.id === catKey ? 'active' : ''}">${c.label}</a>`
  ).join('');

  loadCategoryAds(catKey);
}

async function loadCategoryAds(catKey, city, price){
  const grid = document.getElementById('catAdsGrid');
  const countEl = document.getElementById('resultCount');
  grid.innerHTML = '';
  countEl.textContent = 'Loading...';
  try{
    let q = rzDb.from('ads').select('id, title, city, price, created_at, images').eq('status', 'live');
    if(catKey) q = q.eq('category', catKey);
    if(city) q = q.eq('city', city);
    q = q.order('created_at', {ascending:false});
    const { data, error } = await q;
    if(error) throw error;
    if(!data || data.length === 0){
      countEl.textContent = '0 ads mile.';
      grid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><div class="icon">🗂️</div>Is category mein abhi koi live ad nahi hai. <a href="submit-ad.html">Apni ad submit karein</a>!</div>`;
      return;
    }
    countEl.textContent = `${data.length} ad(s) mile.`;
    grid.innerHTML = data.map(ad => `
      <a class="ad-card" href="ad.html?id=${ad.id}" style="text-decoration:none;color:inherit">
        ${ad.images && ad.images.length ? `<img class="thumb" src="${ad.images[0]}" alt="${ad.title}">` : ''}
        <h4>${ad.title}</h4>
        <span class="meta">${ad.city}${ad.price ? ' · ' + ad.price : ''} · ${new Date(ad.created_at).toLocaleDateString('en-GB')}</span>
      </a>
    `).join('');
  }catch(e){
    countEl.textContent = 'Ads load nahi ho sakin.';
  }
}

document.getElementById('applyFilters').addEventListener('click', () => {
  const params = new URLSearchParams(location.search);
  const catKey = (params.get('cat') || '').toLowerCase();
  const city = document.getElementById('fCity').value;
  const price = document.getElementById('fPrice').value;
  loadCategoryAds(catKey, city, price);
});
</script>
</body>
</html>
